  <!-- croci di centro -->
  <path d="M 531 36 H 591 M 561 6 V 66" stroke="#00A6C8" stroke-width="2"/> <path d="M 531 786 H 591 M 561 756 V 816" stroke="#00A6C8" stroke-width="2"/> <path d="M 6 411 H 66 M 36 381 V 441" stroke="#00A6C8" stroke-width="2"/> <path d="M 1056 411 H 1116 M 1086 381 V 441" stroke="#00A6C8" stroke-width="2"/>
