    <text x="561" y="62" font-size="20" text-anchor="middle">TAGLIO · 88,9 × 63,5 mm al vivo</text>
    <text x="561" y="774" font-size="18" text-anchor="middle" fill="#E8318A">AREA SICURA · tieni testi e loghi dentro la linea magenta</text>
