  <!-- croci di centro -->
  <path d="M 381 36 H 441 M 411 6 V 66" stroke="#00A6C8" stroke-width="2"/> <path d="M 381 1086 H 441 M 411 1056 V 1116" stroke="#00A6C8" stroke-width="2"/> <path d="M 6 561 H 66 M 36 531 V 591" stroke="#00A6C8" stroke-width="2"/> <path d="M 756 561 H 816 M 786 531 V 591" stroke="#00A6C8" stroke-width="2"/>
