<svg xmlns="http://www.w3.org/2000/svg" width="1039" height="744" viewBox="0 0 1039 744">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A8790"/>
      <stop offset="55%" stop-color="#5AA6AD"/>
      <stop offset="100%" stop-color="#3A8790"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#ffffff" opacity="0.08"/>
      <circle cx="12" cy="9" r="0.8" fill="#000000" opacity="0.05"/>
      <circle cx="7" cy="15" r="0.9" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1039" height="744" rx="28" fill="url(#bg)"/>
  <rect width="1039" height="744" rx="28" fill="url(#glow)"/>

  <!-- subtle sunburst -->
  <g opacity="0.10" fill="#1F5960" transform="translate(519.5,372.0)">
    <path d="M0 0 L-1039 -111.6 L-1039 -260.4 Z"/>
    <path d="M0 0 L-1039 111.6 L-1039 260.4 Z"/>
    <path d="M0 0 L1039 -111.6 L1039 -260.4 Z"/>
    <path d="M0 0 L1039 111.6 L1039 260.4 Z"/>
    <path d="M0 0 L-363.65 -744 L-155.85 -744 Z"/>
    <path d="M0 0 L363.65 -744 L155.85 -744 Z"/>
    <path d="M0 0 L-363.65 744 L-155.85 744 Z"/>
    <path d="M0 0 L363.65 744 L155.85 744 Z"/>
  </g>

  <rect width="1039" height="744" rx="28" fill="url(#dots)"/>
  <rect width="1039" height="744" rx="28" fill="#ffffff" filter="url(#paper)" opacity="0.35"/>

  <!-- inner frame -->
  <rect x="14" y="14" width="1011" height="716" rx="20" fill="none" stroke="#1d1d1b" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="24" y="24" width="991" height="696" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
</svg>